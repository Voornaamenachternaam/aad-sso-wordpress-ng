name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        include:
          - php-version: '8.4'
            coverage: false
          - php-version: '8.5'
            coverage: false

    services:
      mysql:
        image: "mysql:8.4"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl, curl, mysql, pdo, pdo_mysql
          coverage: "${{ matrix.coverage && 'xdebug' || 'none' }}"

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Get WordPress
        run: |
          curl -sLO https://wordpress.org/wordpress-6.9.4.tar.gz
          tar -xzf wordpress-6.9.4.tar.gz
          mv wordpress/* .
          rm -rf wordpress wordpress-6.9.4.tar.gz

      - name: Create wp-config.php
        run: |
          cat > wp-config.php << 'EOF'
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          $table_prefix = 'wp_';
          if ( !defined( 'ABSPATH' ) ) {
            define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
          EOF

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --colors=never --no-coverage
          else
            echo "No PHPUnit tests found"
          fi

  phpstan:
    name: PHPStan Static Analysis (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --no-error-summary

  php-cs-fixer:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --diff --dry-run --using-cache=no

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, xdebug

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

      - name: Check Composer
        run: composer validate --strict

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Audit Composer.lock
        run: |
          if command -v security-checker &> /dev/null; then
            security-checker security:check composer.lock
          elif command -v local-php-security-checker &> /dev/null; then
            local-php-security-checker
          else
            echo "Security checker not available, skipping"
          fi

  wordpress-plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, curl, zip, gd

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1.3.1
        with:
          build-dir: .
        continue-on-error: true

  plugin-activation-test:
    name: WordPress Plugin Activation Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    services:
      mysql:
        image: "mysql:8.4"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl, curl, mysql, pdo, pdo_mysql, dom, fileinfo

      - name: Install WP-CLI
        run: |
          curl -sLO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Get WordPress and Install Plugin
        run: |
          # Download WordPress to parent directory
          cd ..
          wp core download --version=6.9.4 --force
          wp config create --dbhost=127.0.0.1 --dbname=wordpress_test --dbuser=root --dbpass=root --quiet
          wp core install --url="http://localhost" --title="Test Site" --admin_user="admin" --admin_password="admin" --admin_email="admin@test.com" --skip-email --quiet
          
          # Copy plugin to WordPress plugins directory (not the repo directory!)
          cp -r aad-sso-wordpress-ng wp-content/plugins/

      - name: Test Plugin Loading (Syntax Check)
        run: |
          # Test that the main plugin file loads without errors
          php -r "
            define('ABSPATH', '/workspace/project/aad-sso-wordpress-ng/wordpress/');
            require_once ABSPATH . 'wp-load.php';
            // Include the autoloader and plugin files
            require_once '/workspace/project/aad-sso-wordpress-ng/vendor/autoload.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/Logger.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/HttpClient.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/Settings.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/SettingsPage.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/AuthorizationHelper.php';
            require_once '/workspace/project/aad-sso-wordpress-ng/GraphHelper.php';
            echo 'All plugin files loaded successfully\n';
          "
        working-directory: /workspace/project/aad-sso-wordpress-ng

      - name: Test Plugin Activation
        run: |
          cd ..
          # Activate the plugin
          wp plugin activate aad-sso-wordpress 2>&1
          
          # Verify plugin is active
          wp plugin is-active aad-sso-wordpress && echo "Plugin activated successfully!" || echo "Plugin activation failed!"
        working-directory: /workspace/project/aad-sso-wordpress-ng

      - name: Test Plugin Deactivation
        run: |
          cd ..
          wp plugin deactivate aad-sso-wordpress 2>&1
          wp plugin is-active aad-sso-wordpress && echo "Deactivation failed!" || echo "Plugin deactivated successfully!"
        working-directory: /workspace/project/aad-sso-wordpress-ng

      - name: Cleanup
        if: always()
        run: |
          wp db drop --yes --quiet 2>/dev/null || true
          rm -f wp-content/debug.log