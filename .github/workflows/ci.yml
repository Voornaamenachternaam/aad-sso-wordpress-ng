name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        include:
          - php-version: '8.4'
            coverage: false
          - php-version: '8.5'
            coverage: false

    services:
      mysql:
        image: "mysql:8.4"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl, curl, mysql, pdo, pdo_mysql
          coverage: "${{ matrix.coverage && 'xdebug' || 'none' }}"

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Get WordPress
        run: |
          curl -sLO https://wordpress.org/wordpress-6.9.4.tar.gz
          tar -xzf wordpress-6.9.4.tar.gz
          mv wordpress/* .
          rm -rf wordpress wordpress-6.9.4.tar.gz

      - name: Create wp-config.php
        run: |
          cat > wp-config.php << 'EOF'
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          $table_prefix = 'wp_';
          if ( !defined( 'ABSPATH' ) ) {
            define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
          EOF

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --colors=never --no-coverage
          else
            echo "No PHPUnit tests found"
          fi

  phpstan:
    name: PHPStan Static Analysis (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --no-error-summary

  php-cs-fixer:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --diff --dry-run --using-cache=no

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, xdebug

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

      - name: Check Composer
        run: composer validate --strict

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Audit Composer.lock
        run: |
          if command -v security-checker &> /dev/null; then
            security-checker security:check composer.lock
          elif command -v local-php-security-checker &> /dev/null; then
            local-php-security-checker
          else
            echo "Security checker not available, skipping"
          fi

  wordpress-plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, curl, zip, gd

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1.1.5
        with:
          build-dir: .
        continue-on-error: true

  plugin-activation-test:
    name: WordPress Plugin Activation Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
        wordpress-version: ['6.9.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress Plugin Integration Test
        uses: holyhope/test-wordpress-plugin-github-action@v2.0.2
        with:
          php_version: "${{ matrix.php-version }}"
          wordpress_version: "${{ matrix.wordpress-version }}"
          php_extensions: |
            mbstring
            json
            openssl
            curl
            mysql
          plugin_slug: aad-sso-wordpress-ng
          plugin_dir: .
          phpunit_version: "^9"
          phpunit_config: phpunit.xml.dist