name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit Tests (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --colors=never --no-coverage
          else
            echo "No PHPUnit tests found"
          fi

  phpstan:
    name: PHPStan Static Analysis (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  php-cs-fixer:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --diff --dry-run --using-cache=no

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl, xdebug

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

      - name: Check Composer
        run: composer validate --strict

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.php-http/discovery true
          composer install --no-interaction --prefer-dist

      - name: Audit Composer.lock
        run: |
          if command -v security-checker &> /dev/null; then
            security-checker security:check composer.lock
          elif command -v local-php-security-checker &> /dev/null; then
            local-php-security-checker
          else
            echo "Security checker not available, skipping"
          fi

  wordpress-plugin-check:
    name: WordPress Plugin Check (Latest WP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1.1.5
        with:
          build-dir: .
          wp-version: latest
        continue-on-error: true

  plugin-activation-php84:
    name: Plugin Activation Test (PHP 8.4, Latest WP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl, curl, mysql, pdo, pdo_mysql, gd, zip
          coverage: none

      - name: Verify PHP version
        run: php -v

      - name: Install WP-CLI
        run: |
          curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Download and setup WordPress (Latest)
        run: |
          wp core download --allow-root
          wp config create \
            --dbname=wordpress_test \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --allow-root
          wp core install \
            --url="http://localhost" \
            --title="Test Site" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@test.com" \
            --skip-email \
            --allow-root

      - name: Setup plugin directory
        run: |
          # Copy plugin files including vendor dependencies
          PLUGIN_DIR="wp-content/plugins/aad-sso-wordpress-ng"
          mkdir -p "$PLUGIN_DIR"

          # Copy files excluding development files and WordPress core
          for item in *; do
            case "$item" in
              node_modules|tests|.git|.github|cache|tmp) continue ;;
              *.md) continue ;;
              wp-content|wp-admin|wp-includes|wp-config.php|index.php|license.txt|readme.html|wp-activate.php|wp-blog-header.php|wp-cron.php|wp-links-opml.php|wp-load.php|wp-login.php|wp-mail.php|wp-settings.php|wp-signup.php|wp-trackback.php|xmlrpc.php) continue ;;
            esac
            if [ -e "$item" ]; then
              cp -r "$item" "$PLUGIN_DIR/"
            fi
          done

          ls -la "$PLUGIN_DIR"
          echo "=== Vendor Directory ==="
          ls -la "$PLUGIN_DIR/vendor/"

      - name: Verify plugin files exist
        run: |
          PLUGIN_DIR="wp-content/plugins/aad-sso-wordpress-ng"
          echo "=== Plugin Files ==="
          ls -la "$PLUGIN_DIR"
          echo ""
          echo "=== Main Plugin File ==="
          head -30 "$PLUGIN_DIR/aad-sso-wordpress.php"

      - name: Check PHP version before activation
        run: |
          echo "Current PHP version: $(php -v | head -1)"
          echo "Plugin requires PHP 8.4+"

      - name: Attempt plugin activation
        run: |
          wp plugin activate aad-sso-wordpress-ng --allow-root
          echo "=== Plugin Status ==="
          wp plugin status aad-sso-wordpress-ng --allow-root
