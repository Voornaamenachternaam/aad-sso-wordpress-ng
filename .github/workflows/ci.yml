name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  phpunit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php-version: '8.4'
            coverage: true
          - php-version: '8.1'
            coverage: false
          - php-version: '8.2'
            coverage: false
          - php-version: '8.3'
            coverage: false
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, openssl, curl, mysql
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Get WordPress
        run: |
          curl -sLO https://wordpress.org/wordpress-6.7.tar.gz
          tar -xzf wordpress-6.7.tar.gz
          mv wordpress/* .
          rm -rf wordpress wordpress-6.7.tar.gz

      - name: Create wp-config.php
        run: |
          cat > wp-config.php << 'EOF'
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          $table_prefix = 'wp_';
          if ( !defined( 'ABSPATH' ) ) {
            define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
          EOF

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No PHPUnit tests found"
          fi

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.4']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  php-cs-fixer:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: '8.4'
          extensions: mbstring, json, openssl, xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./lib/php-jwt/tests/*" -exec php -l {} \;

      - name: Check Composer
        run: composer validate

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer.lock
        run: |
          if command -v security-checker &> /dev/null; then
            security-checker security:check composer.lock
          elif command -v local-php-security-checker &> /dev/null; then
            local-php-security-checker
          else
            echo "Security checker not available, skipping"
          fi

      - name: Run PHPStan Security Analysis
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --level=max --no-progress --configuration=phpstan.neon 2>/dev/null || true
          fi
