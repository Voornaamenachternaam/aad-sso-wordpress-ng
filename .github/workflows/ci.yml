name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  phpunit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']
        include:
          - php-version: '8.5'
            coverage: true
    
    services:
      mysql:
        image: "mysql:9.7"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl, curl, mysql
          coverage: "${{ matrix.coverage && 'xdebug' || 'none' }}"

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Get WordPress
        run: |
          curl -sLO https://wordpress.org/wordpress-6.9.4.tar.gz
          tar -xzf wordpress-6.9.4.tar.gz
          mv wordpress/* .
          rm -rf wordpress wordpress-6.9.4.tar.gz

      - name: Create wp-config.php
        run: |
          cat > wp-config.php << 'EOF'
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          $table_prefix = 'wp_';
          if ( !defined( 'ABSPATH' ) ) {
            define( 'ABSPATH', __DIR__ . '/' );
          }
          require_once ABSPATH . 'wp-settings.php';
          EOF

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No PHPUnit tests found"
          fi

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  php-cs-fixer:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --diff

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, xdebug

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./lib/php-jwt/tests/*" -exec php -l {} \;

      - name: Check Composer
        run: composer validate

  auto-fix-cs:
    name: Auto-Fix Coding Standards
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Run PHP-CS-Fixer
        id: cs-fixer
        run: |
          vendor/bin/php-cs-fixer fix --using-cache=no
        continue-on-error: true

      - name: Commit and push auto-fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply PHP-CS-Fixer auto-fixes"
            git push
          else
            echo "No changes to commit"
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.5'

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Audit Composer.lock
        run: |
          if command -v security-checker &> /dev/null; then
            security-checker security:check composer.lock
          elif command -v local-php-security-checker &> /dev/null; then
            local-php-security-checker
          else
            echo "Security checker not available, skipping"
          fi

      - name: Run PHPStan Security Analysis
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --level=max --no-progress --configuration=phpstan.neon 2>/dev/null || true
          fi

  wordpress-plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2.37.0
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, curl, zip, gd, imagick

      - name: Install Composer dependencies
        run: |
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer install --no-interaction --prefer-dist

      - name: Get WordPress
        run: |
          curl -sLO https://wordpress.org/wordpress-6.9.4.tar.gz
          tar -xzf wordpress-6.9.4.tar.gz
          mv wordpress /tmp/wordpress

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1.1.5
        with:
          path: .
          wordpress-directory: /tmp/wordpress
